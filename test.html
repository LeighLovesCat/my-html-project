<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personal Web Portfolio</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #f4f4f9;
    color: #333;
  }
  header {
    background-color: #3f51b5;
    color: white;
    padding: 1rem 2rem;
    text-align: center;
  }
  .container {
    display: flex;
    flex-wrap: wrap;
    max-width: 1000px;
    margin: 2rem auto;
    gap: 2rem;
    padding: 0 1rem;
  }
  .input-section, .preview-section {
    background: white;
    padding: 1.5rem;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    flex: 1;
    min-width: 320px;
  }
  .input-section form {
    display: flex;
    flex-direction: column;
  }
  .input-section label {
    margin-top: 1rem;
    font-weight: bold;
  }
  .input-section input[type="text"],
  .input-section input[type="email"],
  .input-section input[type="url"],
  .input-section textarea {
    margin-top: 0.3rem;
    padding: 0.5rem;
    font-size: 1rem;
    border: 1px solid #bbb;
    border-radius: 4px;
    resize: vertical;
  }
  .input-section textarea {
    min-height: 80px;
  }
  .input-section button {
    margin-top: 1.5rem;
    padding: 0.75rem;
    font-size: 1rem;
    border: none;
    background-color: #3f51b5;
    color: white;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  .input-section button:hover {
    background-color: #2c3b9e;
  }
  .preview-section h2 {
    margin-top: 0;
    border-bottom: 2px solid #3f51b5;
    padding-bottom: 0.3rem;
  }
  .preview-header {
    text-align: center;
    margin-bottom: 1rem;
  }
  .preview-header h1 {
    margin-bottom: 0.2rem;
  }
  .preview-header h3 {
    margin-top: 0;
    color: #666;
    font-weight: normal;
  }
  .preview-section p {
    line-height: 1.5;
  }
  .contact-info {
    margin-top: 1rem;
  }
  .contact-item {
    margin-bottom: 0.4rem;
  }
  .skills-list {
    list-style-type: square;
    padding-left: 1.2rem;
  }
  @media (max-width: 700px) {
    .container {
      flex-direction: column;
      margin: 1rem;
      gap: 1rem;
    }
  }
</style>
</head>
<body>
<header>
  <h1>Lai Lany D. Lariba</h1>
</header>
<div class="container">
  <section class="input-section">
    <form id="portfolioForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Lai Lany Dorupan Lariba" />

      <label for="title">Title / Role</label>
      <input type="text" id="title" placeholder="Computer Engineeering Student & Graphic Artist" />

      <label for="about">About Me</label>
      <textarea id="about" placeholder="Brief description or bio"></textarea>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="lagraphica.prod24@gmail.com" />

      <label for="phone">Phone</label>
      <input type="text" id="phone" placeholder="+63 919 582 0006" />

      <label for="linkedin">LinkedIn URL</label>
      <input type="url" id="linkedin" placeholder="https://www.linkedin.com/in/lai-lany-lariba-852488245/" />

      <label for="github">GitHub URL</label>
      <input type="url" id="github" placeholder="https://github.com/LeighLovesCat" />

      <label for="skills">Skills (comma separated)</label>
      <input type="text" id="skills" placeholder="Node-RED, Grafana, InfluxDB, Simulink, Matlab" />

      <button type="submit">Update Portfolio</button>
    </form>
  </section>

  <section class="preview-section">
    <h2>Preview</h2>
    <div class="preview-header">
      <h1 id="previewName">Your Name</h1>
      <h3 id="previewTitle">Your Title</h3>
    </div>
    <p id="previewAbout">A little about you will appear here.</p>
    <div class="contact-info">
      <p class="contact-item" id="previewEmail"></p>
      <p class="contact-item" id="previewPhone"></p>
      <p class="contact-item" id="previewLinkedin"></p>
      <p class="contact-item" id="previewGithub"></p>
    </div>
    <div class="skills-section">
      <h4>Skills</h4>
      <ul id="previewSkills" class="skills-list"></ul>
    </div>
  </section>
</div>

<script>
  const form = document.getElementById('portfolioForm');

  function updatePreview(data) {
    document.getElementById('previewName').textContent = data.name || 'Your Name';
    document.getElementById('previewTitle').textContent = data.title || 'Your Title';
    document.getElementById('previewAbout').textContent = data.about || 'A little about you will appear here.';

    const emailEl = document.getElementById('previewEmail');
    emailEl.textContent = '';
    if (data.email) {
      emailEl.innerHTML = `<strong>Email:</strong> <a href="mailto:${data.email}">${data.email}</a>`;
    }

    const phoneEl = document.getElementById('previewPhone');
    phoneEl.textContent = '';
    if (data.phone) {
      phoneEl.innerHTML = `<strong>Phone:</strong> ${data.phone}`;
    }

    const linkedinEl = document.getElementById('previewLinkedin');
    linkedinEl.textContent = '';
    if (data.linkedin) {
      linkedinEl.innerHTML = `<strong>LinkedIn:</strong> <a href="${data.linkedin}" target="_blank" rel="noopener noreferrer">${data.linkedin}</a>`;
    }

    const githubEl = document.getElementById('previewGithub');
    githubEl.textContent = '';
    if (data.github) {
      githubEl.innerHTML = `<strong>GitHub:</strong> <a href="${data.github}" target="_blank" rel="noopener noreferrer">${data.github}</a>`;
    }

    const skillsEl = document.getElementById('previewSkills');
    skillsEl.innerHTML = '';
    if (data.skills) {
      const skillsArray = data.skills.split(',').map(s => s.trim()).filter(s => s.length > 0);
      skillsArray.forEach(skill => {
        const li = document.createElement('li');
        li.textContent = skill;
        skillsEl.appendChild(li);
      });
    }
  }

  form.addEventListener('submit', function(event) {
    event.preventDefault();
    const formData = {
      name: document.getElementById('name').value.trim(),
      title: document.getElementById('title').value.trim(),
      about: document.getElementById('about').value.trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      linkedin: document.getElementById('linkedin').value.trim(),
      github: document.getElementById('github').value.trim(),
      skills: document.getElementById('skills').value.trim()
    };
    updatePreview(formData);
  });

  // Optional: update preview live as user types
  ['name','title','about','email','phone','linkedin','github','skills'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      const formData = {
        name: document.getElementById('name').value.trim(),
        title: document.getElementById('title').value.trim(),
        about: document.getElementById('about').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        linkedin: document.getElementById('linkedin').value.trim(),
        github: document.getElementById('github').value.trim(),
        skills: document.getElementById('skills').value.trim()
      };
      updatePreview(formData);
    });
  });

  // Initialize preview with default values
  updatePreview({});
</script>
</body>
</html>
